<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licitaciones</title>
<style>/* Paleta corporativa de Telefónica (archivo .ase). Azul #0066ff, grises Grey 0-9 y colores secundarios:
   orquídea = nuevas, naranja = encaje alto, turquesa = actualizadas, amarillo = encaje medio, coral = plazo urgente o cerrado.
   El mapa usa el azul corporativo en cuatro tonos (los tonos claros son el azul mezclado con blanco). */
:root{
  --papel:#f7f7ff; --tarjeta:#ffffff; --tinta:#031a34; --suave:#58617a; --linea:#d1d5e4;
  --marca:#0066ff; --marca-fondo:#e5efff; --sobre-marca:#ffffff;
  --orq:#7f258e; --orq-bg:#f1e0fa; --orq-tx:#471551; --sobre-orq:#ffffff;
  --nar:#c48349; --nar-bg:#fce3cd; --nar-tx:#63442a;
  --tur:#528889; --tur-bg:#c5f8f9; --tur-tx:#253d3c;
  --ama:#a7863e; --ama-bg:#f8f0bd; --ama-tx:#473515;
  --cor:#d6786b; --cor-bg:#f9eeed; --cor-tx:#843c34;
  --alerta:#843c34; --alerta-fondo:#f9eeed; --bien:#253d3c; --bien-fondo:#c5f8f9;
  --mapa0:#e9ebf3; --mapa1:#cce0ff; --mapa2:#80b2ff; --mapa3:#0066ff; --mapa4:#031a34;
  --g1:#0066ff; --g2:#b86be8; --g3:#c48349; --g4:#75c0c7; --g5:#d6786b; --g6:#e4c35c; --g7:#528889; --g8:#6e7894;
  --sombra:0 1px 2px rgba(3,26,52,.05),0 6px 18px rgba(3,26,52,.05);
  --fuente:"Bahnschrift","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
:root[data-tema="oscuro"]{
  --papel:#031a34; --tarjeta:#0c2543; --tinta:#f7f7ff; --suave:#b0b6ca; --linea:#27395a;
  --marca:#4d94ff; --marca-fondo:#11315f; --sobre-marca:#031a34;
  --orq:#b86be8; --orq-bg:#3b1d52; --orq-tx:#e1c3f4; --sobre-orq:#031a34;
  --nar:#f4c495; --nar-bg:#4a331f; --nar-tx:#fce3cd;
  --tur:#75c0c7; --tur-bg:#1c4447; --tur-tx:#c5f8f9;
  --ama:#e4c35c; --ama-bg:#473515; --ama-tx:#f3e996;
  --cor:#d6786b; --cor-bg:#491818; --cor-tx:#f2b1a5;
  --alerta:#f2b1a5; --alerta-fondo:#491818; --bien:#c5f8f9; --bien-fondo:#1c4447;
  --mapa0:#17304f; --mapa1:#1d4278; --mapa2:#2a6bd0; --mapa3:#5b9bff; --mapa4:#b8d4ff;
  --g1:#4d94ff; --g2:#b86be8; --g3:#f4c495; --g4:#75c0c7; --g5:#d6786b; --g6:#e4c35c; --g7:#8fc9cf; --g8:#8f97af;
  --sombra:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --papel:#031a34; --tarjeta:#0c2543; --tinta:#f7f7ff; --suave:#b0b6ca; --linea:#27395a;
    --marca:#4d94ff; --marca-fondo:#11315f; --sobre-marca:#031a34;
    --orq:#b86be8; --orq-bg:#3b1d52; --orq-tx:#e1c3f4; --sobre-orq:#031a34;
    --nar:#f4c495; --nar-bg:#4a331f; --nar-tx:#fce3cd;
    --tur:#75c0c7; --tur-bg:#1c4447; --tur-tx:#c5f8f9;
    --ama:#e4c35c; --ama-bg:#473515; --ama-tx:#f3e996;
    --cor:#d6786b; --cor-bg:#491818; --cor-tx:#f2b1a5;
    --alerta:#f2b1a5; --alerta-fondo:#491818; --bien:#c5f8f9; --bien-fondo:#1c4447;
    --mapa0:#17304f; --mapa1:#1d4278; --mapa2:#2a6bd0; --mapa3:#5b9bff; --mapa4:#b8d4ff;
    --g1:#4d94ff; --g2:#b86be8; --g3:#f4c495; --g4:#75c0c7; --g5:#d6786b; --g6:#e4c35c; --g7:#8fc9cf; --g8:#8f97af;
    --sombra:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 var(--fuente)}
a{color:var(--marca)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px;border-radius:4px}
.contenedor{max-width:1180px;margin:0 auto;padding:0 20px}

/* cabecera */
header.cab{background:var(--tarjeta);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:5}
header.cab .contenedor{display:flex;align-items:center;gap:22px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;line-height:1.15;letter-spacing:.005em;text-decoration:none;color:var(--tinta)}
.logo svg{width:34px;height:34px;flex:none;color:var(--marca)}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--suave);letter-spacing:0}
.logo small:empty{display:none}
/* logo propio (Configuración > Empresa): uno para el tema claro y otro para el oscuro */
.logo img.lg{width:34px;height:34px;flex:none;object-fit:contain;display:none}
.logo.con-logo svg{display:none}
.logo.con-logo img.lg-claro{display:block}
:root[data-tema="oscuro"] .logo.con-logo img.lg-claro{display:none}
:root[data-tema="oscuro"] .logo.con-logo img.lg-oscuro{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]) .logo.con-logo img.lg-claro{display:none}
  :root:not([data-tema="claro"]) .logo.con-logo img.lg-oscuro{display:block}
}
nav.menu{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav.menu a{padding:8px 15px;border-radius:999px;text-decoration:none;color:var(--suave);font-weight:600}
nav.menu a[aria-current="page"]{background:var(--marca-fondo);color:var(--marca)}
nav.menu a:hover{color:var(--tinta)}
nav.menu a.fin{margin-left:auto}
.tema{background:none;border:1px solid var(--linea);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--suave)}
.tema:hover{border-color:var(--marca);color:var(--tinta)}

main{padding:26px 0 64px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.015em;margin:0 0 6px}
h2{font-size:17px;line-height:1.3;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--suave);margin:0 0 20px}
.aviso{border-radius:10px;padding:11px 15px;margin:0 0 16px;border:1px solid}
.aviso.mal{background:var(--cor-bg);border-color:var(--cor);color:var(--cor-tx)}
.aviso.ojo{background:var(--ama-bg);border-color:var(--ama);color:var(--ama-tx)}
.aviso strong{display:block}

.rejilla{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.rejilla{grid-template-columns:1fr}}
.panel{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:18px 20px;box-shadow:var(--sombra)}
.panel+.panel{margin-top:20px}
.panel-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 14px;margin-bottom:10px}
.panel-cab h2{margin:0}
.panel-cab p{margin:0;font-size:12.5px;color:var(--suave)}

/* mapa de comunidades */
.mapa-stage{position:relative;width:min(100%,calc(76vh * 1.136));aspect-ratio:960/845;margin:0 auto;overflow:hidden;border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none}
#m-svg{display:block;width:100%;height:100%;cursor:grab}
#m-svg.reposo{cursor:default}
#m-svg.arrastre{cursor:grabbing}
.region{stroke:var(--tarjeta);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .15s;cursor:zoom-in}
.region.n0{fill:var(--mapa0)}
.region.n1{fill:var(--mapa1)}
.region.n2{fill:var(--mapa2)}
.region.n3{fill:var(--mapa3)}
.region.n4{fill:var(--mapa4)}
.region.sobre{stroke:var(--tinta);stroke-width:1.8}
.region.elegida{stroke:var(--tinta);stroke-width:2.2}
.inset{fill:none;stroke:var(--linea);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
.guia{stroke:var(--mapa4);stroke-width:1.25;opacity:.7}
.ancla{fill:var(--mapa4)}
.burbuja .b{transition:transform .12s ease-out;transform-box:fill-box;transform-origin:center}
.burbuja.sobre .b{transform:scale(1.08)}
.lk{outline:none;cursor:pointer}
.bc{fill:var(--tarjeta);stroke:var(--mapa4);stroke-width:2;transition:fill .12s}
.bc.vacia{stroke:var(--linea);stroke-width:1.5}
.lk:hover .bc{fill:var(--marca-fondo)}
.lk:focus-visible .bc{stroke:var(--tinta);stroke-width:3.5}
.bn{fill:var(--tinta);font-family:var(--fuente);font-weight:700;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums;pointer-events:none}
.bn.vacia{fill:var(--suave);font-weight:600}
.pill{fill:var(--orq);stroke:var(--tarjeta);stroke-width:1.5;transition:fill .12s}
.lk-hoy:hover .pill{fill:var(--tinta)}
.lk-hoy:focus-visible .pill{stroke:var(--tinta);stroke-width:2.5}
.pt{fill:var(--sobre-orq);font-family:var(--fuente);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mapa-ctl{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px}
.mapa-ctl button,.m-back{font:inherit;color:var(--tinta);background:var(--tarjeta);border:1px solid var(--linea);cursor:pointer;box-shadow:var(--sombra)}
.mapa-ctl button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;padding:0}
.mapa-ctl button:hover,.m-back:hover{border-color:var(--marca)}
.mapa-ctl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.m-back{position:absolute;top:6px;left:6px;height:36px;padding:0 13px;border-radius:9px;font-size:14px;font-weight:600}
[hidden]{display:none!important}
.m-tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--tinta);color:var(--papel);border-radius:10px;padding:10px 12px;min-width:170px;max-width:240px;font-size:13px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:3}
.m-tip .mt-n{font-weight:700;font-size:14px}
.m-tip .mt-v{margin-top:2px}
.m-tip .mt-v b{font-size:24px;font-weight:700;margin-right:2px;font-variant-numeric:tabular-nums}
.m-tip .mt-h{font-weight:700}
.m-tip .mt-h.nada,.m-tip .mt-r{font-weight:400;opacity:.7}
.m-tip .mt-r{margin-top:3px;font-size:12px}
.leyenda{display:flex;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--suave);margin-top:12px;flex-wrap:wrap}
.leyenda .sw{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.leyenda i{width:20px;height:11px;border-radius:3px;display:inline-block}
.leyenda .clave{display:inline-flex;align-items:center;gap:6px}
.leyenda .kb{min-width:28px;height:18px;padding:0 6px;border-radius:9px;background:var(--orq);color:var(--sobre-orq);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.otras{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{border:1px solid var(--linea);background:var(--tarjeta);border-radius:999px;padding:5px 14px;cursor:pointer;text-decoration:none;color:var(--tinta);font-size:13.5px}
.chip:hover{border-color:var(--marca);background:var(--marca-fondo)}
.chip b{margin-left:6px}

/* etiquetas */
.et{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.et.alto{background:var(--nar-bg);color:var(--nar-tx)}
.et.medio{background:var(--ama-bg);color:var(--ama-tx)}
.et.nueva{background:var(--orq-bg);color:var(--orq-tx)}
.et.act{background:var(--tur-bg);color:var(--tur-tx)}
.et.ya{background:var(--mapa0);color:var(--suave)}
.et.cerrada,.et.urgente{background:var(--cor-bg);color:var(--cor-tx)}

/* listas de licitaciones */
.lista{list-style:none;margin:0;padding:0}
.fila{display:block;text-decoration:none;color:inherit;padding:13px 10px;margin:0 -10px;border-bottom:1px solid var(--linea);border-radius:8px}
.fila:last-child{border-bottom:0}
.fila:hover{background:var(--papel)}
.fila:hover .tit{text-decoration:underline}
.fila .tit{font-weight:600;line-height:1.3}
.fila .meta{color:var(--suave);font-size:13px;margin-top:4px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.fila .meta .imp{color:var(--tinta);font-weight:600}
.pal{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.pal span{background:var(--marca-fondo);color:var(--marca);border-radius:999px;padding:0 9px;font-size:12px}
.vacio{color:var(--suave);padding:20px 4px}
.vacio b{color:var(--tinta)}

/* resumen de hoy */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.cifra{background:var(--papel);border-radius:10px;padding:12px 14px}
.cifra b{display:block;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.cifra span{font-size:12px;color:var(--suave)}
.cifra:nth-child(1){background:var(--orq-bg)}.cifra:nth-child(1) b{color:var(--orq)}.cifra:nth-child(1) span{color:var(--orq-tx)}
.cifra:nth-child(2){background:var(--nar-bg)}.cifra:nth-child(2) b,.cifra:nth-child(2) span{color:var(--nar-tx)}
.cifra:nth-child(3){background:var(--tur-bg)}.cifra:nth-child(3) b,.cifra:nth-child(3) span{color:var(--tur-tx)}

/* listado */
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:end;background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:14px 16px;box-shadow:var(--sombra)}
.filtros label{display:flex;flex-direction:column;font-size:12px;color:var(--suave);gap:3px}
.filtros input,.filtros select{border:1px solid var(--linea);background:var(--tarjeta);border-radius:8px;padding:8px 10px;min-width:140px}
.filtros input[type=search]{min-width:220px}
.boton{border:1px solid var(--marca);background:var(--marca);color:var(--sobre-marca);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.boton:hover{filter:brightness(1.08)}
.boton.sec{background:none;color:var(--marca)}
.boton.sec:hover{background:var(--marca-fondo);filter:none}
.cuenta{color:var(--suave);margin:0 0 8px}

/* ficha */
.ficha-cab{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:16px 0}
.dato{background:var(--tarjeta);border:1px solid var(--linea);border-radius:10px;padding:10px 14px}
.dato span{display:block;font-size:12px;color:var(--suave)}
.dato b{font-size:16px}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th,.tabla td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
.tabla th{font-size:12px;color:var(--suave);font-weight:600}
.tabla td.num{text-align:right;white-space:nowrap}
.pag{display:inline-block;margin:0 4px 4px 0;padding:0 9px;border:1px solid var(--marca);border-radius:999px;text-decoration:none;font-size:13px}
.extracto{color:var(--suave);font-size:13px;margin-top:3px}
.volver{display:inline-block;margin-bottom:14px;text-decoration:none;font-weight:600}
.tabla.dias td a{margin-right:10px}
.pie{color:var(--suave);font-size:12px;margin-top:24px}

/* estadísticas de Inicio por grupo de palabras clave */
.est{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:18px 20px;margin:0 0 20px;box-shadow:var(--sombra)}
.est h2{margin:0 0 2px}
.est h2:focus{outline:none}
.est .sub{margin:0 0 14px;font-size:13px}
.est-kpis{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.est-kpi{background:var(--papel);border-radius:10px;padding:9px 16px;min-width:160px}
.est-kpi b{display:block;font-size:28px;line-height:1.1;color:var(--marca);font-variant-numeric:tabular-nums}
.est-kpi span{font-size:12px;color:var(--suave)}
.est-kpi:nth-child(1){background:var(--marca-fondo)}
.est-kpi:nth-child(2){background:var(--tur-bg)}.est-kpi:nth-child(2) b,.est-kpi:nth-child(2) span{color:var(--tur-tx)}
.est-lista{list-style:none;margin:0;padding:0}
.est-fila{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;padding:10px 8px;border:0;border-bottom:1px solid var(--linea);border-radius:8px;background:none;text-align:left;text-decoration:none;color:var(--tinta);cursor:pointer}
.est-lista li:last-child .est-fila{border-bottom:0}
.est-fila:hover{background:var(--marca-fondo)}
.est-fila .est-n{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.est-fila .est-n i{flex:none;width:10px;height:10px;border-radius:50%}
.est-fila b{font-size:16px;font-variant-numeric:tabular-nums}
.est-barra{display:block;height:8px;background:var(--mapa0);border-radius:4px;overflow:hidden}
.est-barra span{display:block;height:100%;border-radius:4px}
.est-volver{border:0;background:none;color:var(--marca);font-weight:600;padding:4px 0;margin:0 0 8px;cursor:pointer}
.est-volver:hover{text-decoration:underline}
.est-nota{color:var(--suave);font-size:12px;margin:12px 0 0}

@media(max-width:560px){
  .contenedor{padding:0 14px}
  main{padding-top:18px}
  h1{font-size:24px}
  .panel,.est{padding:14px}
  .est-fila{grid-template-columns:minmax(0,1fr) auto}
  .est-fila .est-barra{grid-column:1/-1;order:3}
  .mapa-ctl button{width:34px;height:34px}
  header.cab .contenedor{gap:4px 12px;min-height:0}
  .logo{order:1}
  .tema{order:2;margin-left:auto}
  nav.menu{order:3;flex:0 0 100%;margin:0 -8px}
  nav.menu a{padding:7px 12px}
}
@media (prefers-reduced-motion:reduce){.burbuja .b,.region,.bc,.pill{transition:none}}
@media print{header.cab,.filtros,.volver,.mapa-ctl,.m-back{display:none}}
</style>
</head>
<body>
<header class="cab"><div class="contenedor">
  <a class="logo" href="#/" id="logo"><svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="currentColor"/><circle cx="16" cy="18" r="7.5" fill="none" stroke="var(--tarjeta)" stroke-width="3"/><circle cx="25" cy="9" r="3.6" fill="var(--tarjeta)"/></svg><span>Licitaciones<small id="empresa"></small></span></a>
  <nav class="menu" aria-label="Principal">
    <a href="#/" data-v="inicio">Inicio</a>
    <a href="#/lista" data-v="lista">Todas</a>
    <a href="#/dias" data-v="dias">Por día</a>
    <a href="#/config" data-v="config" class="fin">Configuración</a>
  </nav>
  <button class="tema" id="tema" type="button" aria-label="Cambiar entre tema claro y oscuro">Tema</button>

<script>
"use strict";
(function(){
var D = window.DATOS;
var app = document.getElementById("app");
var MAPA=null,MAPA_OBS=null,MAPA_GEO=null,MAPA_DATOS=null;

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function safeUrl(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:"";}
function rutaLocal(r){return r?encodeURI(r).replace(/#/g,"%23"):"";}
var eur=new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
function dinero(n){return n==null||n===""?"—":eur.format(n);}
function fechaHora(iso){if(!iso)return "—";var d=new Date(iso);if(isNaN(d))return esc(iso);
  return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"})+(iso.length>10?" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"");}
function fechaDia(iso){if(!iso)return "—";var p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;}
function diasHasta(iso){if(!iso)return null;var d=new Date(iso);if(isNaN(d))return null;return Math.ceil((d-new Date())/86400000);}
function plazo(f){
  var n=diasHasta(f.limite||f.fecha_limite);
  if(n===null)return {txt:"Sin plazo indicado",cls:""};
  if(n<0)return {txt:"Plazo cerrado",cls:"cerrada"};
  if(n<=5)return {txt:(n===0?"Cierra hoy":n===1?"Cierra mañana":"Cierra en "+n+" días"),cls:"urgente"};
  return {txt:"Quedan "+n+" días",cls:""};
}
function normaliza(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function etNovedad(n){return n==="Nueva"?'<span class="et nueva">Nueva</span>':n==="Actualizada"?'<span class="et act">Actualizada</span>':n?'<span class="et ya">'+esc(n)+'</span>':"";}
function etEncaje(e){return e==="ALTO"?'<span class="et alto">Encaje alto</span>':e==="MEDIO"?'<span class="et medio">Encaje medio</span>':"";}
function lugar(f){var p=[f.ciudad,f.provincia,f.ccaa,f.pais&&f.pais!=="España"?f.pais:""].filter(function(x,i,a){return x&&a.indexOf(x)===i&&!(i>0&&a[i-1]&&x.indexOf(a[i-1])===0&&0);});
  return p.length?p.join(", ")+(f.aprox?" (aprox.)":""):"Sin ubicación";}

/* ---------- comunidades y mapa de teselas ---------- */
var CCAA=[["Galicia",0,0],["Asturias",1,0],["Cantabria",2,0],["País Vasco",3,0],["Navarra",4,0],
 ["Castilla y León",1,1,2],["La Rioja",3,1],["Aragón",4,1],["Cataluña",5,1],
 ["Extremadura",0,2],["Madrid",2,2],["Castilla-La Mancha",3,2],["Comunidad Valenciana",4,2],["Baleares",6,2],
 ["Andalucía",1,3],["Ceuta",2,3],["Melilla",3,3],["Murcia",4,3],["Canarias",0,4]];
var NOMBRES=CCAA.map(function(c){return c[0];});
function grupo(f){
  if(f.ccaa&&NOMBRES.indexOf(f.ccaa)>=0)return f.ccaa;
  if(f.pais&&f.pais!=="España")return "__extranjero";
  return "__estatal";
}
var NOMGRUPO={"__extranjero":"Fuera de España","__estatal":"Estatal o sin ubicar"};
function nombreGrupo(g){return NOMGRUPO[g]||g;}
function abiertas(f){var n=diasHasta(f.limite);return n===null||n>=0;}

/* ---------- estado y filtros (viven en la dirección, así se pueden compartir) ---------- */
function parseHash(){
  var h=location.hash.replace(/^#\/?/,""),q="",i=h.indexOf("?");
  if(i>=0){q=h.slice(i+1);h=h.slice(0,i);}
  var p={};q.split("&").forEach(function(kv){if(!kv)return;var a=kv.split("=");p[decodeURIComponent(a[0])]=decodeURIComponent((a[1]||"").replace(/\+/g," "));});
  return {ruta:h.split("/").filter(Boolean),p:p};
}
function enlace(ruta,p){
  var q=Object.keys(p||{}).filter(function(k){return p[k]!=="";}).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(p[k]);}).join("&");
  return "#/"+ruta+(q?"?"+q:"");
}

/* ---------- vistas ---------- */
function filaHTML(f){
  var pl=plazo(f),pal=(f.palabras||[]).slice(0,5);
  var imp=f.interes!=null&&f.lotes>1?'<span class="imp">Te interesa '+dinero(f.interes)+'</span><span>de '+dinero(f.presupuesto)+'</span>':'<span class="imp">'+dinero(f.presupuesto)+'</span>';
  return '<a class="fila" href="#/l/'+esc(f.id)+'"><div class="tit">'+esc(f.titulo)+'</div>'
   +'<div class="meta">'+etNovedad(f.novedad)+etEncaje(f.encaje)+imp
   +'<span class="et '+pl.cls+'" style="'+(pl.cls?"":"background:none;padding:0;font-weight:400;color:inherit")+'">'+esc(pl.txt)+'</span>'
   +'<span>'+esc(f.organo)+'</span><span>'+esc(lugar(f))+'</span></div>'
   +(pal.length?'<div class="pal">'+pal.map(function(t){return "<span>"+esc(t)+"</span>";}).join("")+'</div>':'')+'</a>';
}

function avisos(){
  var h="",mal=(D.fuentes||[]).filter(function(x){return !x.ok;});
  if(mal.length)h+='<div class="aviso mal" role="alert"><strong>Hoy no se ha podido leer '+mal.map(function(x){return esc(x.nombre);}).join(", ")+'.</strong>Puede faltar alguna licitación reciente. '+mal.map(function(x){return esc(x.texto);}).join(" ")+'</div>';
  var g=new Date(D.generado),h2=(new Date()-g)/3600000;
  if(!isNaN(g)&&h2>48)h+='<div class="aviso ojo"><strong>Los datos tienen más de dos días.</strong>Última actualización: '+fechaHora(D.generado)+'. Pide que revisen la tarea programada.</div>';
  return h;
}

function vistaInicio(){
  var F=D.fichas,hoy=D.ultimoDia;
  var nuevasHoy=F.filter(function(f){return f.primera===hoy;});
  var recientes=F.filter(function(f){return f.novedad==="Nueva"||f.novedad==="Actualizada"||f.primera===hoy;});
  var cierran=F.filter(function(f){var n=diasHasta(f.limite);return n!==null&&n>=0&&n<=7;}).sort(function(a,b){return new Date(a.limite)-new Date(b.limite);});
  var porG={},nuevosG={};
  F.forEach(function(f){if(!abiertas(f))return;var g=grupo(f);porG[g]=(porG[g]||0)+1;if(f.primera===hoy)nuevosG[g]=(nuevosG[g]||0)+1;});
  var max=Math.max.apply(null,[1].concat(Object.keys(porG).map(function(k){return porG[k];})));
  function nivel(n){if(!n)return 0;var r=n/max;return r>.75?4:r>.5?3:r>.25?2:1;}
  MAPA_DATOS={porG:porG,nuevosG:nuevosG,max:max,nivel:nivel,href:function(nom,soloHoy){return enlace("lista",soloHoy?{ccaa:nom,abiertas:"1",dia:hoy}:{ccaa:nom,abiertas:"1"});}};
  var otras=["__estatal","__extranjero"].filter(function(g){return porG[g];}).map(function(g){
    return '<a class="chip" href="'+enlace("lista",{ccaa:g,abiertas:"1"})+'">'+nombreGrupo(g)+'<b>'+porG[g]+'</b></a>';}).join("");
  var altas=nuevasHoy.filter(function(f){return f.encaje==="ALTO";}).length;

  return avisos()
   +'<h1>Oportunidades abiertas</h1><p class="sub">Búsqueda del '+fechaDia(hoy)+(D.hora?' a las '+esc(D.hora):'')+'. Actualizado '+fechaHora(D.generado)+'.</p>'
   +'<div class="rejilla"><div>'
   +'<section class="panel" aria-labelledby="t-mapa"><div class="panel-cab"><h2 id="t-mapa">Por comunidad autónoma</h2><p>Arrastra para moverte y rueda para ampliar. Pulsa el número para ver el listado.</p></div>'
   +'<div class="mapa-stage" id="m-stage"><svg id="m-svg" class="reposo" role="group" aria-label="Mapa de licitaciones abiertas por comunidad autónoma"><g id="m-world"><rect class="inset" id="m-inset" rx="5"></rect><g id="m-reg" aria-hidden="true"></g></g><g id="m-lead" aria-hidden="true"></g><g id="m-bub"></g></svg>'
   +'<button class="m-back" id="m-back" type="button" hidden>← Mapa completo</button>'
   +'<div class="mapa-ctl"><button type="button" id="m-zin" aria-label="Acercar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" id="m-zout" aria-label="Alejar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button type="button" id="m-zreset" aria-label="Ver todo el mapa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>'
   +'<div class="m-tip" id="m-tip" hidden role="status"></div></div>'
   +'<div class="leyenda" id="m-leyenda"></div>'
   +(otras?'<div class="otras">'+otras+'</div>':'')+'</section>'
   +'<section class="panel"><h2>Cierran en los próximos 7 días</h2>'
   +(cierran.length?'<div class="lista">'+cierran.slice(0,6).map(filaHTML).join("")+'</div>'+(cierran.length>6?'<p><a href="'+enlace("lista",{orden:"plazo",abiertas:"1"})+'">Ver las '+cierran.length+' que cierran pronto</a></p>':''):'<p class="vacio">Ninguna licitación cierra esta semana.</p>')
   +'</section></div><div>'
   +'<section class="panel"><h2>Hoy</h2><div class="cifras">'
   +'<div class="cifra"><b>'+nuevasHoy.length+'</b><span>nuevas</span></div>'
   +'<div class="cifra"><b>'+altas+'</b><span>de encaje alto</span></div>'
   +'<div class="cifra"><b>'+F.filter(function(f){return f.novedad==="Actualizada";}).length+'</b><span>actualizadas</span></div></div>'
   +'<p class="sub" style="margin:8px 0 0">'+(D.descartadas||0)+' descartadas por poca relevancia · '+(D.conocidas||0)+' ya conocidas.</p></section>'
   +'<section class="panel"><h2>Novedades</h2>'
   +(recientes.length?'<div class="lista">'+recientes.slice(0,8).map(filaHTML).join("")+'</div>'+(recientes.length>8?'<p><a href="'+enlace("lista",{novedad:"1"})+'">Ver las '+recientes.length+' novedades</a></p>':'')
     :'<p class="vacio"><b>Hoy no hay novedades.</b> Cuando el programa encuentre algo nuevo o que haya cambiado, saldrá aquí.</p>')
   +'</section></div></div>';
}

function opciones(valores,sel,todas){
  return '<option value="">'+todas+'</option>'+valores.map(function(v){return '<option value="'+esc(v[0])+'"'+(v[0]===sel?" selected":"")+'>'+esc(v[1])+'</option>';}).join("");
}

function filtrar(p){
  var q=normaliza(p.q||"");
  var r=D.fichas.filter(function(f){
    if(p.ccaa&&grupo(f)!==p.ccaa)return false;
    if(p.encaje&&f.encaje!==p.encaje)return false;
    if(p.abiertas==="1"&&!abiertas(f))return false;
    if(p.novedad==="1"&&!(f.novedad==="Nueva"||f.novedad==="Actualizada"))return false;
    if(p.dia&&f.primera!==p.dia&&f.dia!==p.dia)return false;
    if(p.fuente&&f.fuente!==p.fuente)return false;
    if(q){var txt=normaliza([f.titulo,f.organo,f.expediente,f.ciudad,f.provincia,(f.palabras||[]).join(" ")].join(" "));
      if(!q.split(/\s+/).every(function(t){return txt.indexOf(t)>=0;}))return false;}
    return true;
  });
  var o=p.orden||"puntos";
  r.sort(function(a,b){
    if(o==="plazo"){var x=a.limite?new Date(a.limite):new Date(8e15),y=b.limite?new Date(b.limite):new Date(8e15);return x-y;}
    if(o==="importe")return (b.interes!=null?b.interes:(b.presupuesto||0))-(a.interes!=null?a.interes:(a.presupuesto||0));
    if(o==="reciente")return (b.primera||"").localeCompare(a.primera||"");

}

function vistaLista(p){

/* ---------- estadísticas de Inicio: ofertas por grupo de palabras clave ----------
   El grupo de cada palabra sale de «Por qué encaja» de cada ficha (termino, grupo), cargada con cargarFicha. */
var EST={estado:"",hechas:0,fallos:0,sinPal:0,grupos:Object.create(null),sel:null};
var EST_COL=["var(--g1)","var(--g2)","var(--g3)","var(--g4)","var(--g5)","var(--g6)","var(--g7)","var(--g8)"];
function estColor(n){var k=Object.keys(EST.grupos).sort(function(a,b){return a.localeCompare(b,"es");});return EST_COL[Math.max(0,k.indexOf(n))%EST_COL.length];}
function estAnade(id,f){
  var tiene=false;
  (f.palabras||[]).forEach(function(p){
    var g=String(p.grupo||"").trim(),t=String(p.termino||"").trim();
    if(!g||!t)return;tiene=true;
    var G=EST.grupos[g]||(EST.grupos[g]={ofertas:Object.create(null),n:0,pal:Object.create(null)});
    if(!G.ofertas[id]){G.ofertas[id]=1;G.n++;}
    var P=G.pal[t]||(G.pal[t]={ofertas:Object.create(null),n:0});
    if(!P.ofertas[id]){P.ofertas[id]=1;P.n++;}
  });
  if(!tiene)EST.sinPal++;
}
function estCargar(){
  if(EST.estado)return;
  EST.estado="cargando";
  var ids=D.fichas.map(function(f){return f.id;}),i=0,vivos=0,fin=false;
  function sig(){
    if(i>=ids.length){if(vivos===0&&!fin){fin=true;EST.estado="listo";estPintar();}return;}
    var id=ids[i++];vivos++;
    cargarFicha(id,function(f){estAnade(id,f);hecho();},function(){EST.fallos++;hecho();});
  }
  function hecho(){vivos--;EST.hechas++;if(EST.hechas%10===0)estPintar();Promise.resolve().then(sig);}
  for(var k=0;k<6;k++)sig();
}

        g.setAttribute("aria-label",NAMES[id]+": ninguna licitación abierta");
        el("circle",{"class":"bc vacia",r:rad.toFixed(1)},b);
        el("text",{"class":"bn vacia","font-size":Math.max(9,7*f+.4*rad).toFixed(1)},b).textContent="0";
      }
      var o=MAPA_OFF[id],off=o?[o[0]*f,o[1]*f]:[0,0],it={id:id,c:r.c,off:off,g:g,rad:rad,pos:[0,0]};
      if(o){it.line=el("line",{"class":"guia"},gLead);it.dot=el("circle",{"class":"ancla",r:2.5},gLead);}
      if(hoverId===id)g.setAttribute("class","burbuja sobre");
      items.push(it);bubbleEl[id]=g;
    });
  }
  function clampView(v){
    v.k=Math.min(8,Math.max(1,v.k));
    v.x=Math.min(0,Math.max(stageW*(1-v.k),v.x));
    v.y=Math.min(0,Math.max(stageH*(1-v.k),v.y));
    return v;
  }
  function render(){
    var sc=s*view.k;
    gWorld.setAttribute("transform","translate("+view.x+" "+view.y+") scale("+sc+")");
    items.forEach(function(it){
      var cx=it.c[0]*sc+view.x,cy=it.c[1]*sc+view.y,px=cx+it.off[0],py=cy+it.off[1];
      it.pos=[px,py];
      it.g.setAttribute("transform","translate("+px.toFixed(1)+" "+py.toFixed(1)+")");
      if(it.line){
        it.line.setAttribute("x1",cx.toFixed(1));it.line.setAttribute("y1",cy.toFixed(1));
        it.line.setAttribute("x2",px.toFixed(1));it.line.setAttribute("y2",py.toFixed(1));
        it.dot.setAttribute("cx",cx.toFixed(1));it.dot.setAttribute("cy",cy.toFixed(1));
      }
    });
    if(view.k<=1.001)svg.classList.add("reposo");else svg.classList.remove("reposo");
    if(tipMode==="anchor"&&tipId)placeAnchored(tipId);
  }

  /* ficha emergente */
  function tipHTML(id){
    var n=DATA[id][0],t=DATA[id][1];
    return '<div class="mt-n">'+esc(NAMES[id])+'</div>'
      +(n?'<div class="mt-v"><b>'+n+'</b> '+lic(n)+'</div>':'<div class="mt-v">Ninguna licitación abierta</div>')
      +(t?'<div class="mt-h">+'+t+' nuevas hoy</div>':'<div class="mt-h nada">Sin novedades hoy</div>')
      +'<div class="mt-r">Puesto '+rankOf(id)+' de '+counts.length+(n?'. Pulsa el número para ver el listado.':'.')+'</div>';
  }
  function showTip(id){if(tipId!==id)tip.innerHTML=tipHTML(id);tipId=id;tip.hidden=false;}
  function hideTip(){tipId=null;tipMode=null;tip.hidden=true;}
  function placeAtPointer(x,y){
    var w=tip.offsetWidth,h=tip.offsetHeight,l=x+16,t=y-h-14;
    if(l+w>stageW-4)l=x-16-w;if(l<4)l=4;if(t<4)t=y+18;if(t+h>stageH-4)t=stageH-h-4;
    tip.style.transform="translate("+Math.round(l)+"px,"+Math.round(t)+"px)";
  }
  function placeAnchored(id){
    var it=null;items.forEach(function(i){if(i.id===id)it=i;});if(!it)return;
    var w=tip.offsetWidth,h=tip.offsetHeight,x=it.pos[0],y=it.pos[1],l=x-w/2,t=y-it.rad-h-12;
    if(t<4)t=y+it.rad+12;
    l=Math.min(stageW-w-4,Math.max(4,l));t=Math.min(stageH-h-4,Math.max(4,t));
    tip.style.transform="translate("+Math.round(l)+"px,"+Math.round(t)+"px)";
  }
  function setHover(id){
    if(hoverId===id)return;
    if(hoverId){regionEl[hoverId].classList.remove("sobre");bubbleEl[hoverId].classList.remove("sobre");}
    hoverId=id;
    if(id){
      regionEl[id].classList.add("sobre");bubbleEl[id].classList.add("sobre");
      gReg.appendChild(regionEl[id]);
      if(selId&&selId!==id)gReg.appendChild(regionEl[selId]);
    }
  }

  /* animación de la vista */
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,raf=0;
  function animateTo(target,dur){
    cancelAnimationFrame(raf);clampView(target);
    if(reduce||!dur){view=target;render();return;}
    var from={k:view.k,x:view.x,y:view.y},t0=performance.now();
    function step(now){
      var u=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-u,3);
      view={k:from.k+(target.k-from.k)*e,x:from.x+(target.x-from.x)*e,y:from.y+(target.y-from.y)*e};
      render();if(u<1)raf=requestAnimationFrame(step);
    }
    raf=requestAnimationFrame(step);
  }
  function zoomAt(qx,qy,nk,v){
    var base=v||view;nk=Math.min(8,Math.max(1,nk));var r=nk/base.k;
    return {k:nk,x:qx-(qx-base.x)*r,y:qy-(qy-base.y)*r};
  }
  function setSel(id){
    if(selId&&regionEl[selId])regionEl[selId].classList.remove("elegida");
    selId=id;
    if(id){regionEl[id].classList.add("elegida");gReg.appendChild(regionEl[id]);}
    back.hidden=!id;
  }
  function select(id){
    var bb=regionEl[id].getBBox(),k=Math.min(8,Math.max(1.6,Math.min(.7*W/bb.width,.7*H/bb.height)));
    var cx=bb.x+bb.width/2,cy=bb.y+bb.height/2;
    setSel(id);
    animateTo({k:k,x:stageW/2-cx*s*k,y:stageH/2-cy*s*k},420);
  }
  function resetView(){setSel(null);animateTo({k:1,x:0,y:0},380);}
  MAPA={reset:resetView};

  /* punteros: arrastrar, pellizcar, hover y clic */
  var ptrs={},nptr=0,drag=null,pinch=null,justDragged=false;
  function local(e){var r=st.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
  function idAt(e){var n=e.target.closest&&e.target.closest("[data-id]");return n?n.getAttribute("data-id"):null;}
  function two(){var k=Object.keys(ptrs);return [ptrs[k[0]],ptrs[k[1]]];}

  /* un arrastre no debe abrir el enlace sobre el que termina */
  svg.addEventListener("click",function(e){if(justDragged){e.preventDefault();e.stopPropagation();}},true);
  svg.addEventListener("pointerdown",function(e){
    var l=local(e);ptrs[e.pointerId]={x:l[0],y:l[1],sx:l[0],sy:l[1],type:e.pointerType,target:e.target};nptr++;
    cancelAnimationFrame(raf);
    if(nptr===2){var p=two();pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2};drag={moved:true};}
    else drag={moved:false};
  });
  svg.addEventListener("pointermove",function(e){
    var p=ptrs[e.pointerId],l=local(e),x=l[0],y=l[1];
    if(!p){
      if(e.pointerType==="mouse"){
        var id=idAt(e);setHover(id);
        if(id){tipMode="pointer";showTip(id);placeAtPointer(x,y);}else hideTip();
      }
      return;
    }
    var dx=x-p.x,dy=y-p.y;p.x=x;p.y=y;
    if(nptr===2&&pinch){
      var q=two(),d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y)||1,mx=(q[0].x+q[1].x)/2,my=(q[0].y+q[1].y)/2;
      var v=zoomAt(mx,my,view.k*d/pinch.d);v.x+=mx-pinch.mx;v.y+=my-pinch.my;
      view=clampView(v);pinch={d:d,mx:mx,my:my};hideTip();render();return;
    }
    if(!drag.moved&&Math.hypot(x-p.sx,y-p.sy)>5){
      drag.moved=true;svg.classList.add("arrastre");
      try{svg.setPointerCapture(e.pointerId);}catch(_){}
      setHover(null);hideTip();
    }
    if(drag.moved&&nptr===1){
      view=clampView({k:view.k,x:view.x+dx,y:view.y+dy});render();
      if(selId&&view.k<1.05)setSel(null);
    }
  });
  function endPtr(e){
    var p=ptrs[e.pointerId];if(!p)return;
    delete ptrs[e.pointerId];nptr--;
    if(nptr<2)pinch=null;
    if(nptr===0){
      svg.classList.remove("arrastre");
      if(drag&&drag.moved){justDragged=true;setTimeout(function(){justDragged=false;},60);}
      if(drag&&!drag.moved&&e.type==="pointerup"){
        var rg=p.target.closest&&p.target.closest(".region");
        if(rg){
          var id=rg.getAttribute("data-id");select(id);
          if(p.type!=="mouse"){setHover(id);tipMode="anchor";showTip(id);}
        }else if(p.type!=="mouse"&&!(p.target.closest&&p.target.closest(".burbuja"))){setHover(null);hideTip();}
      }
      drag=null;
    }
  }
  svg.addEventListener("pointerup",endPtr);
  svg.addEventListener("pointercancel",endPtr);
  svg.addEventListener("pointerleave",function(e){if(e.pointerType==="mouse"&&!nptr){setHover(null);hideTip();}});
  svg.addEventListener("wheel",function(e){
    e.preventDefault();
    var dy=e.deltaMode===1?e.deltaY*16:e.deltaY,l=local(e);
    cancelAnimationFrame(raf);
    view=clampView(zoomAt(l[0],l[1],view.k*Math.exp(-dy*.0016)));
    if(selId&&view.k<1.05)setSel(null);
    render();
    if(tipMode==="pointer")placeAtPointer(l[0],l[1]);
  },{passive:false});

  /* teclado: los números son enlaces y se enfocan con Tab */
  gBub.addEventListener("focusin",function(e){
    var n=e.target.closest&&e.target.closest("[data-id]");if(!n)return;
    var id=n.getAttribute("data-id");setHover(id);tipMode="anchor";showTip(id);placeAnchored(id);
  });
  gBub.addEventListener("focusout",function(){setHover(null);hideTip();});

  /* botones */
  document.getElementById("m-zin").addEventListener("click",function(){animateTo(zoomAt(stageW/2,stageH/2,view.k*1.6),220);});
  document.getElementById("m-zout").addEventListener("click",function(){
    var v=zoomAt(stageW/2,stageH/2,view.k/1.6);if(v.k<1.05)setSel(null);animateTo(v,220);
  });
  document.getElementById("m-zreset").addEventListener("click",resetView);
  back.addEventListener("click",resetView);

  /* tamaño */
  function measure(){
    var r=st.getBoundingClientRect();if(!r.width)return;
    stageW=r.width;stageH=r.height;s=stageW/W;
    var nf=Math.round(Math.min(1.1,Math.max(.62,stageW/900))*100)/100;
    if(nf!==f||!items.length){f=nf;build();}
    clampView(view);render();
  }
  if(window.ResizeObserver){MAPA_OBS=new ResizeObserver(measure);MAPA_OBS.observe(st);}
  measure();
}

/* ---------- arranque ---------- */
function marcaMenu(v){[].forEach.call(document.querySelectorAll("nav.menu a"),function(a){if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});}
/* El panel de configuración vive en config/configuracion.js y solo se carga al entrar (funciona aunque aún no haya datos). */
function vistaConfig(sub){
  marcaMenu("config");window.scrollTo(0,0);
  if(window.PanelConfig){window.PanelConfig.mostrar(app,sub);return;}
  app.innerHTML='<p class="vacio" aria-live="polite">Cargando la configuración…</p>';
  var s=document.createElement("script");s.src="config/configuracion.js";
  s.onload=function(){if(/^#\/config/.test(location.hash))window.PanelConfig.mostrar(app,sub);};
  s.onerror=function(){app.innerHTML='<div class="aviso mal" role="alert"><strong>No se encuentra la carpeta config.</strong>Copia la carpeta «config» junto a index.html (debe contener configuracion.js y jszip.min.js).</div>';};
  document.head.appendChild(s);
}
function pintar(){
  var h=parseHash(),r=h.ruta;
  MAPA=null;if(MAPA_OBS){MAPA_OBS.disconnect();MAPA_OBS=null;}
  if(r[0]==="config"){document.title="Configuración · Licitaciones";vistaConfig(r[1]);return;}
  if(!D){app.innerHTML='<div class="aviso mal" role="alert"><strong>Todavía no hay datos.</strong>No se encuentra datos/indice.js. Ejecuta el programa (licitaciones.py) para generarlos y abre esta página desde la misma carpeta.</div>';return;}
  document.title="Licitaciones"+(document.getElementById("empresa").textContent?" · "+document.getElementById("empresa").textContent:"");
  if(r[0]==="l"&&r[1]){marcaMenu("");vistaFicha(r[1]);return;}
  if(r[0]==="lista"){marcaMenu("lista");vistaLista(h.p);window.scrollTo(0,0);return;}
  if(r[0]==="dias"){marcaMenu("dias");app.innerHTML=vistaDias();window.scrollTo(0,0);return;}
  marcaMenu("inicio");app.innerHTML=vistaInicio();window.scrollTo(0,0);montarMapa();estadisticas();
}
/* nombre de la empresa y logo de la cabecera. El panel de configuración la llama al guardar,
   para que el cambio se vea al momento en este navegador (para el resto, en la próxima ejecución). */
function pintarMarca(empresa,claro,oscuro){
  document.getElementById("empresa").textContent=empresa||"";
  var a=document.getElementById("logo");
  [].forEach.call(a.querySelectorAll("img.lg"),function(i){i.remove();});
  oscuro=oscuro||claro;
  if(claro){
    [["lg-claro",claro],["lg-oscuro",oscuro]].forEach(function(x){
      var i=document.createElement("img");i.className="lg "+x[0];i.alt="";i.src="config/"+encodeURIComponent(x[1]);
      i.onerror=function(){a.classList.remove("con-logo");};
      a.insertBefore(i,a.firstChild);
    });
    a.classList.add("con-logo");
  }else a.classList.remove("con-logo");
  if(D)document.title="Licitaciones"+(empresa?" · "+empresa:"");
}
window.pintarMarca=pintarMarca;
if(D)pintarMarca(D.empresa,(D.logo||{}).claro,(D.logo||{}).oscuro);
var raizTema=document.documentElement;
try{var t=localStorage.getItem("tema");if(t)raizTema.setAttribute("data-tema",t);}catch(e){}
document.getElementById("tema").addEventListener("click",function(){
  var osc=raizTema.getAttribute("data-tema")==="oscuro"||(!raizTema.getAttribute("data-tema")&&matchMedia("(prefers-color-scheme:dark)").matches);
  var n=osc?"claro":"oscuro";raizTema.setAttribute("data-tema",n);try{localStorage.setItem("tema",n);}catch(e){}
});
window.addEventListener("hashchange",pintar);
pintar();
})();
